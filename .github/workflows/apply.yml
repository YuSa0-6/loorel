# main: after approval, create and update Runpod endpoints, then open a PR for endpoints.json.
# Secret: RUNPOD_API_KEY in the "production" environment (a key that can write).
name: apply

on:
  push:
    branches: [main]
    paths:
      - "loorel.config.ts"
      - "endpoints/**"
      # Code-only changes need an explicit workflow_dispatch after review.
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete endpoints whose directory was removed (only those in endpoints.json)"
        type: boolean
        default: false

permissions:
  contents: read

# One apply at a time, in order. A queued run waits instead of being cancelled.
concurrency:
  group: runpod-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # push the bot/endpoints-json branch
      pull-requests: write # open the endpoints.json pull request
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runpod apply
        id: apply
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PRUNE: ${{ inputs.prune && '--prune' || '' }}
        run: pnpm -s apply $PRUNE --out apply.md
      - name: Job summary
        if: ${{ !cancelled() }}
        run: '[ -f apply.md ] && cat apply.md >> "$GITHUB_STEP_SUMMARY" || true'
      # Runs after a partial failure too, so endpoints created before the error are recorded.
      - name: Pull request for endpoints.json
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          add-paths: endpoints.json
          branch: bot/endpoints-json
          delete-branch: true
          commit-message: "chore: update endpoints.json"
          title: "chore: update endpoints.json"
          body: |
            `sync.ts --apply` changed the endpoint IDs on Runpod.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
