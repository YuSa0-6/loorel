# Builds the decision-model worker image (workers/decision). Pull requests only build it;
# main pushes ghcr.io/<owner>/loorel-decision-worker:<workers/decision/VERSION>.
# A released tag is never overwritten: bump VERSION to publish a change.
name: decision-worker

on:
  pull_request:
    paths:
      - "workers/decision/**"
      - ".github/workflows/decision-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/decision/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same pull request replaces the older one. Every other run gets its own
# group, so no main push is cancelled or dropped from the queue.
concurrency:
  group: decision-worker-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Image reference
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/loorel-decision-worker:$(cat workers/decision/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released tag
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF already exists; bump workers/decision/VERSION to publish a change"
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: workers/decision
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.ref }}
