# Builds the decision-model worker image (workers/decision). Pull requests only build it;
# main pushes ghcr.io/<owner>/loorel-decision-worker:<workers/decision/VERSION>.
# A released tag is never overwritten: bump VERSION to publish a change.
name: decision-worker

on:
  pull_request:
    paths:
      - "workers/decision/**"
      - ".github/workflows/decision-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/decision/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image reference
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/loorel-decision-worker:$(cat workers/decision/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released tag
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF already exists; bump workers/decision/VERSION to publish a change"
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: workers/decision
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.ref }}
