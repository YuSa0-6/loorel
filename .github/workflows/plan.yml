# Pull request: check and test, then post the Runpod plan as a PR comment.
# Writes nothing to Runpod. Secret: RUNPOD_API_KEY_READONLY (repository secret, Read Only key).
name: plan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # fallow audit compares against the base branch, so it needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test run
      - name: Decision worker tests
        run: python3 -m unittest discover -s workers/decision -t workers/decision
      # Unused files, exports and dependencies anywhere in the repository.
      - run: pnpm exec fallow dead-code
      # Complexity and duplication in the files this pull request changes.
      - run: pnpm exec fallow audit --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  plan:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post and update the plan comment
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runpod plan
        id: plan
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY_READONLY }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            # Pull requests from forks get no secrets.
            echo "::notice::RUNPOD_API_KEY_READONLY is not available; skipping the plan"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm -s plan --out plan.md
      - name: Job summary
        if: ${{ !cancelled() && steps.plan.outputs.skipped != 'true' }}
        run: '[ -f plan.md ] && cat plan.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Comment on the pull request
        if: ${{ !cancelled() && steps.plan.outputs.skipped != 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- loorel-plan -->";
            const plan = fs.existsSync("plan.md")
              ? fs.readFileSync("plan.md", "utf8")
              : "### Runpod plan\n\nThe plan did not run. See the job log.";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${plan}\n\n<sub>${context.sha.slice(0, 7)} · [job log](${run})</sub>`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const mine = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
