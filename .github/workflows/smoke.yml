# Manual, paid inference check against an existing endpoint. Never runs on a push or PR.
# Creates, changes and deletes nothing on Runpod; the endpoint ID comes from endpoints.json.
# Secrets: RUNPOD_API_KEY ("production" environment). The gateway route also needs
# CF_AIG_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable); CF_AIG_GATEWAY_ID defaults to runpod.
name: smoke

on:
  workflow_dispatch:
    inputs:
      confirm_cost:
        description: "I authorize paid inference (one request per route; a cold start bills GPU time)"
        type: boolean
        required: true
        default: false
      model:
        description: "Model name (defineModel name, a key of endpoints.json)"
        type: string
        default: qwen3-8b
      route:
        description: "direct = api.runpod.ai, gateway = Cloudflare AI Gateway"
        type: choice
        options: [both, direct, gateway]
        default: both
      timeout_ms:
        description: "Per-request timeout in ms (the first request may wait for a cold start)"
        type: string
        default: "600000"

permissions:
  contents: read

concurrency:
  group: runpod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm the manual cost approval
        env:
          CONFIRM_COST: ${{ inputs.confirm_cost }}
        run: test "$CONFIRM_COST" = true
      - name: Read the endpoint ID from endpoints.json
        id: endpoint
        env:
          MODEL: ${{ inputs.model }}
        run: |
          id=$(jq -r --arg m "$MODEL" '.[$m].id // empty' endpoints.json)
          if ! [[ "$id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::endpoints.json has no endpoint ID for this model. Run apply first."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
      - name: Direct to Runpod
        if: ${{ inputs.route != 'gateway' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          LOOREL_MODEL: ${{ inputs.model }}
          RUNPOD_ENDPOINT_ID: ${{ steps.endpoint.outputs.id }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: pnpm -s smoke --timeout-ms "$TIMEOUT_MS" --out artifacts/smoke-direct.json
      # Runs after a direct failure too, so one dispatch reports both routes.
      - name: Through Cloudflare AI Gateway
        if: ${{ !cancelled() && steps.endpoint.outcome == 'success' && inputs.route != 'direct' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_ID: ${{ vars.CF_AIG_GATEWAY_ID || 'runpod' }}
          LOOREL_MODEL: ${{ inputs.model }}
          ENDPOINT_ID: ${{ steps.endpoint.outputs.id }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: |
          if [ -z "$CF_AIG_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CF_AIG_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable for the gateway route."
            exit 1
          fi
          pnpm -s smoke --timeout-ms "$TIMEOUT_MS" --out artifacts/smoke-gateway.json \
            --base-url "https://gateway.ai.cloudflare.com/v1/${CLOUDFLARE_ACCOUNT_ID}/${GATEWAY_ID}/custom-runpod/v2/${ENDPOINT_ID}/openai/v1"
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          echo "### Runpod smoke" >> "$GITHUB_STEP_SUMMARY"
          for route in direct gateway; do
            f="artifacts/smoke-$route.json"
            [ -f "$f" ] || continue
            jq -r --arg r "$route" '"- \($r): " + (if .ok then "ok (\(.elapsedMs) ms, \(.usage.totalTokens // "?") tokens)" else "failed: \(.error.code)" + (if .error.httpStatus then " (HTTP \(.error.httpStatus))" else "" end) end)' "$f"
          done >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-results-${{ github.run_id }}
          path: artifacts/smoke-*.json
          if-no-files-found: warn
          retention-days: 7
